name: Daily Tender Check

on:
  schedule:
    # Pokreće se svaki dan u 8:00 ujutru po našem vremenu
    - cron: '0 7 * * *'  # 7:00 UTC = 8:00 po našem vremenu (zimi)
  workflow_dispatch:  # Omogućava ručno pokretanje

jobs:
  check-tenders:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Run tender check
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      run: python daily_tender_check.py
