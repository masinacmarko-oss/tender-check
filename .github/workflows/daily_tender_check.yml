name: Daily Tender Check

on:
  workflow_dispatch:

  schedule:
    # Pokretanje svakog dana u 06:00 UTC
    - cron: "0 6 * * *"

jobs:
  tender-check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show version check
        run: |
          echo "=== MAŠINAC CEJN VERSION CHECK ==="
          grep 'VERSION =' daily_tender_check.py || true
          grep 'PAGE_SIZE =' daily_tender_check.py || true
          grep 'MAX_PAGES =' daily_tender_check.py || true

      - name: Run CEJN Tender Monitor
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python daily_tender_check.py
