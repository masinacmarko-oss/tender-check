name: Daily Tender Check

on:
  workflow_dispatch:

  schedule:
    # 06:00 UTC
    # Crna Gora:
    # 08:00 tokom ljetnjeg računanja vremena
    # 07:00 tokom zimskog računanja vremena
    - cron: "0 6 * * *"

jobs:

  tender-check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show version check
        run: |
          echo "=== daily_tender_check.py VERSION ==="
          grep 'VERSION =' daily_tender_check.py || true
          grep 'MAX_PAGES =' daily_tender_check.py || true

      - name: Run CEJN Tender Monitor
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python daily_tender_check.py
